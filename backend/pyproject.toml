[project]
name = "learningtracker-backend"
version = "0.1.0"
description = "API LearningTracker (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
 
[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
 
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
